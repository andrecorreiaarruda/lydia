<html lang="pt-BR">
<head>

<title>Lydia</title>

<script>
  // aplica o tema escolhido antes de desenhar a página, para não piscar
  try { var t = localStorage.getItem('lydia.tema'); if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light'); else if (t === 'escuro') document.documentElement.setAttribute('data-theme', 'dark'); } catch (_) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Lydia — fundo off-white, cartões brancos arredondados, um único azul de ação; modo escuro automático ou escolhido */
:root {
  --bg: #f5f5f7; --surface: #ffffff; --surface-2: #f5f5f7; --surface-3: #ececf0; --track: #dcdce1;
  --seg: #e8e8ed; --seg-on: #ffffff;
  --ink: #1d1d1f; --ink-2: #6e6e73; --line: #e0e0e0; --sep: #ececf0;
  --accent: #0066cc; --accent-ink: #ffffff; --accent-soft: #e6f0fa;
  --good: #1a7f37; --good-soft: #e3f3e7; --warn: #8a5300; --warn-soft: #fbf0dc; --bad: #c4231b; --bad-soft: #fbe4e2;
  --bar: rgba(255, 255, 255, 0.88); --tab: #6e6e73;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: var(--font-body);
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 18px; --r-sm: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --surface-3: #3a3a3c; --track: #48484a;
    --seg: #1c1c1e; --seg-on: #3a3a3c;
    --ink: #f5f5f7; --ink-2: #a1a1a6; --line: #38383a; --sep: #2c2c2e;
    --accent: #2997ff; --accent-ink: #000000; --accent-soft: rgba(41, 151, 255, 0.16);
    --good: #30d158; --good-soft: rgba(48, 209, 88, 0.16); --warn: #ffb340; --warn-soft: rgba(255, 179, 64, 0.16); --bad: #ff6961; --bad-soft: rgba(255, 105, 97, 0.16);
    --bar: rgba(28, 28, 30, 0.92); --tab: #8e8e93;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --surface-3: #3a3a3c; --track: #48484a;
  --seg: #1c1c1e; --seg-on: #3a3a3c;
  --ink: #f5f5f7; --ink-2: #a1a1a6; --line: #38383a; --sep: #2c2c2e;
  --accent: #2997ff; --accent-ink: #000000; --accent-soft: rgba(41, 151, 255, 0.16);
  --good: #30d158; --good-soft: rgba(48, 209, 88, 0.16); --warn: #ffb340; --warn-soft: rgba(255, 179, 64, 0.16); --bad: #ff6961; --bad-soft: rgba(255, 105, 97, 0.16);
  --bar: rgba(28, 28, 30, 0.92); --tab: #8e8e93;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.47; min-height: 100vh; -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px max(20px, env(safe-area-inset-right, 0px)) 32px max(20px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); text-wrap: balance; }
h1 { font-size: 34px; font-weight: 600; letter-spacing: -0.8px; line-height: 1.1; }
h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.2; }
h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; line-height: 1.3; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--font-data); font-size: .92em; }

/* Topo */
.top { display: grid; gap: 10px; }
.top-linha { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marca { font-size: 20px; font-weight: 600; letter-spacing: -0.4px; }
.tema-btn { appearance: none; border: 0; background: var(--surface); color: var(--ink); border-radius: 9999px; min-height: 36px; padding: 6px 12px; font: 500 13px var(--font-body); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.tema-btn svg { width: 16px; height: 16px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.pills:empty { display: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 9999px; background: var(--surface); color: var(--ink-2); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); }
.pill.ok .dot { background: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.warn .dot { background: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.bad .dot { background: var(--bad); }
.pill.accent { color: var(--accent); }

/* Abas: barra fixa embaixo no celular, segmentada no alto no computador */
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
.tab { appearance: none; border: 0; background: none; color: var(--tab); font: 500 11px var(--font-body); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; padding: 6px 2px; cursor: pointer; position: relative; white-space: nowrap; }
.tab svg { width: 24px; height: 24px; flex: 0 0 auto; }
.tab[aria-selected="true"] { color: var(--accent); }
.tab .count { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 600 11px/18px var(--font-body); }
.tab .count:empty { display: none; }
@media (max-width: 719px) {
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; border-top: 1px solid var(--line); padding: 4px max(4px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
  body { padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
}
@media (min-width: 720px) {
  .tabs { position: sticky; top: 8px; z-index: 20; background: var(--seg); border-radius: 9999px; padding: 4px; gap: 2px; }
  .tab { flex-direction: row; gap: 6px; font-size: 14px; min-height: 40px; border-radius: 9999px; color: var(--ink-2); }
  .tab svg { width: 18px; height: 18px; }
  .tab[aria-selected="true"] { background: var(--seg-on); color: var(--ink); }
  .tab .count { position: static; }
}

/* Conteúdo */
.view { display: grid; gap: 16px; }
.card { background: var(--surface); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.pilha { display: grid; gap: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { appearance: none; border: 0; background: var(--surface-2); color: var(--accent); font: 500 15px var(--font-body); padding: 10px 18px; min-height: 44px; border-radius: 9999px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.texto { background: transparent; padding: 10px 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.link-btn { appearance: none; border: 0; background: none; color: var(--accent); font: inherit; padding: 0; cursor: pointer; text-decoration: underline; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--seg); border-radius: 9999px; padding: 3px; gap: 2px; }
.seg button { appearance: none; border: 0; background: transparent; color: var(--ink-2); font: 500 14px var(--font-body); min-height: 36px; padding: 0 12px; border-radius: 9999px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; }
.chips::-webkit-scrollbar { display: none; }
.filtro { appearance: none; flex: 0 0 auto; border: 0; background: var(--surface); color: var(--ink); font: 500 14px var(--font-body); padding: 8px 14px; min-height: 36px; border-radius: 9999px; cursor: pointer; white-space: nowrap; }
.filtro.num { font-family: var(--font-data); }
.filtro[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 9999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.up { color: var(--good); }
.down { color: var(--bad); }

/* Indicadores */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 720px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 960px) { .kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border-radius: var(--r-sm); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.kpi .l { font-size: 12px; color: var(--ink-2); }
.kpi .v { font-family: var(--font-data); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 12px; color: var(--ink-2); }

/* Robô */
.robo-topo { display: grid; gap: 4px; }
.ticker-grande { font-size: 52px; font-weight: 600; letter-spacing: -1.4px; line-height: 1; }
.robo-conta { font-family: var(--font-data); font-size: 16px; color: var(--ink-2); }
.robo-conta b { color: var(--ink); font-weight: 500; }
.painel { background: var(--surface-2); border-radius: var(--r-sm); padding: 14px; display: grid; gap: 10px; }
.trava { display: grid; gap: 8px; padding: 14px; border-radius: var(--r-sm); background: var(--warn-soft); }
.trava .label { color: var(--warn); }
.fila { display: grid; gap: 8px; }
.fila-item { display: grid; grid-template-columns: 64px 1fr 54px; gap: 10px; align-items: center; font-size: 13px; }
.barra { height: 6px; background: var(--track); border-radius: 3px; position: relative; overflow: hidden; }
.barra span { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
.barra i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
details.mais summary { cursor: pointer; color: var(--accent); font-size: 14px; }
.registro { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; background: var(--good-soft); border-radius: 12px; padding: 10px 12px; }
.field { display: grid; gap: 6px; }
.field input { font: 500 16px var(--font-data); padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); width: 180px; max-width: 100%; }
input.qtd { width: 88px; font: 500 15px var(--font-data); text-align: right; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); }

/* Escada */
.escada { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; gap: 6px; }
.degrau { appearance: none; border: 0; text-align: left; background: var(--surface-2); color: var(--ink-2); border-radius: 10px; padding: 8px 6px; cursor: pointer; display: grid; align-content: start; gap: 2px; font: inherit; min-width: 0; }
.degrau .n { font-family: var(--font-data); font-size: 11px; }
.degrau .t { font-size: 12px; font-weight: 600; line-height: 1.25; -webkit-hyphens: auto; hyphens: auto; overflow-wrap: break-word; }
.degrau.passada { background: var(--accent-soft); color: var(--accent); }
.degrau.atual { background: var(--accent); color: var(--accent-ink); }
.degrau.escolhida { outline: 2px dashed var(--accent); outline-offset: 2px; }
.confirma { background: var(--accent-soft); border-radius: var(--r-sm); padding: 14px; display: grid; gap: 10px; }

/* Listas: carteira, renda fixa, meninas */
.grupo-titulo { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); padding: 0 4px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.lista { background: var(--surface); border-radius: var(--r); padding: 0 16px; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--sep); }
.item:last-child { border-bottom: 0; }
.ico { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; flex: 0 0 auto; text-decoration: none; }
.ico:hover { text-decoration: none; }
.item-meio { flex: 1 1 auto; min-width: 0; display: grid; gap: 1px; }
.item-tit { font-size: 16px; font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.item-tit a { color: inherit; }
.item-sub { font-size: 12px; color: var(--ink-2); }
.item-dir { display: grid; justify-items: end; gap: 1px; text-align: right; flex: 0 0 auto; }
.item-dir .p { font-family: var(--font-data); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
.item-dir .v { font-family: var(--font-data); font-size: 13px; }

/* Notícias */
.noticias { display: grid; gap: 12px; }
.nota { background: var(--surface); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; min-width: 0; }
.nota .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-2); }
.nota .resumo { font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.para-carteira { font-size: 14px; line-height: 1.45; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.lados { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lado { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.4; }
.lado b { display: block; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 4px; }
.vies { background: var(--warn-soft); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.4; }
.vies b { color: var(--warn); }
.aviso { padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface); font-size: 14px; }
.aviso.warn { background: var(--warn-soft); }
footer { font-size: 12px; color: var(--ink-2); padding: 8px 4px 0; display: grid; gap: 4px; }
.portao { max-width: 560px; width: 100%; margin: 12px auto; }
.portao textarea { font: 13px/1.45 var(--font-data); width: 100%; min-height: 220px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--ink); resize: vertical; }
.erro { color: var(--bad); font-size: 14px; }

/* Gráfico */
.gt-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.gt-preco-box { text-align: right; }
.gt-preco { font-family: var(--font-data); font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
.gt-box { position: relative; height: 440px; border-radius: 12px; overflow: hidden; background: var(--surface); }
.gt-legenda { position: absolute; top: 8px; left: 10px; z-index: 3; pointer-events: none; font: 12px var(--font-data); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: calc(100% - 80px); }
.gt-legenda b { color: var(--ink); font-weight: 500; }
.gt-mm { display: inline-flex; align-items: center; gap: 4px; }
.gt-mm i { display: inline-block; width: 14px; height: 2px; border-radius: 1px; }
.field.token input { width: 260px; font-size: 14px; }
@media (max-width: 520px) {
  h1 { font-size: 30px; }
  .ticker-grande { font-size: 44px; }
  .gt-box { height: 340px; }
  .gt-preco { font-size: 24px; }
  .gt-preco-box { text-align: left; }
}
@media (prefers-reduced-motion: no-preference) {
  .barra span { transition: width .4s ease; }
}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="top-linha"><span class="marca">Lydia</span><button class="tema-btn" id="btn-tema" type="button"></button></div>
    <div class="pills" id="pills"></div>
    <h1 id="titulo" hidden></h1>
  </header>

  <nav class="tabs" role="tablist" id="tabs" aria-label="Seções">
    <button class="tab" role="tab" id="tab-aporte" data-v="aporte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l5-5 4 4 7-7M14 9h6v6"/></svg><span>Aporte</span></button>
    <button class="tab" role="tab" id="tab-carteira" data-v="carteira"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v12H3zM3 7l3-3h12l3 3M16 13h2"/></svg><span>Carteira</span></button>
    <button class="tab" role="tab" id="tab-grafico" data-v="grafico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v18M17 3v18M5 7h4v8H5zM15 9h4v6h-4z"/></svg><span>Gráfico</span></button>
    <button class="tab" role="tab" id="tab-renda-fixa" data-v="renda-fixa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M6 20v-9M10 20v-9M14 20v-9M18 20v-9M3 10l9-6 9 6"/></svg><span>Renda fixa</span></button>
    <button class="tab" role="tab" id="tab-noticias" data-v="noticias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11v16H5zM16 8h3v12h-3M8 8h5M8 12h5M8 16h3"/></svg><span>Notícias</span><span class="count" id="ncount"></span></button>

</div>

<script>
(() => {
  const ATIVOS = [
    { t: 'BBAS3', nome: 'Banco do Brasil', tipo: 'acao', seg: 'Banco · controle estatal', meta: 1 },
    { t: 'BBSE3', nome: 'BB Seguridade', tipo: 'acao', seg: 'Seguros · controle do BB', meta: 1 },

  let saveTimer = null, saveChain = Promise.resolve();

  function spark(hist) {
    const h = (Array.isArray(hist) ? hist : []).filter(x => isNum(x.p)).slice(-30);

      const lados = Array.isArray(n.leituras) && n.leituras.length ? `<div class="lados">${n.leituras.slice(0, 2).map(l => `<div class="lado"><b>${esc(l.quem)}</b>${esc(l.diz)}</div>`).join('')}</div>` : '';
      const vies = n.confirma ? `<div class="vies"><b>Confirma o que você já pensa.</b> ${n.contraponto ? 'O melhor argumento do outro lado: ' + esc(n.contraponto) : 'Leia o fato antes da opinião.'}</div>` : '';
      const tipo = n.tipo && n.tipo !== 'fato' ? `<span class="chip">${esc(TIPO[n.tipo] || n.tipo)}</span>` : '';
      const tese = n.tese && n.tese !== 'nao' ? `<span class="chip ${t[1]}">${t[0]}</span>` : '';
      return `<article class="nota">
        <div class="meta"><span class="num">${esc(dm(n.data) || '')}</span><span>·</span><span>${esc(n.fonte || '')}</span>${tipo}${tese}${ativos}</div>
        <h3>${esc(n.titulo)}</h3><p class="resumo">${esc(n.resumo)}</p>${n.nota ? `<p class="para-carteira"><b>Para a carteira:</b> ${esc(n.nota)}</p>` : ''}${lados}${vies}
        ${u ? `<a class="small" href="${esc(u)}" target="_blank" rel="noopener">Ler na fonte ›</a>` : ''}</article>`;
    };
    return `<p class="small muted" style="padding:0 4px">A sua tendência decide quais temas entram, não qual lado aparece. Quando uma notícia bate com o seu perfil político, ela vem marcada, junto com o melhor argumento de quem pensa diferente.</p>
      <div class="chips" role="group" aria-label="Filtrar notícias">${chips}</div>
      <div class="noticias">${lista.length ? lista.map(card).join('') : '<p class="muted">Nada neste filtro hoje.</p>'}</div>
      <p class="small muted" style="padding:0 4px">Atualizado em ${state.noticias.atualizadoEm ? esc(dm(state.noticias.atualizadoEm)) : '—'}. Resumos escritos pelo Claude; o texto completo está na fonte.</p>`;
  }

  function renderView() {
    const v = document.getElementById('view');
    if (v.contains(document.activeElement) && document.activeElement.matches('input, textarea')) { state.pendingRender = true; return; }
    state.pendingRender = false;
    if (state.acesso !== 'ok') { v.innerHTML = portaoHTML(); return; }
    let html = '';
    if (state.err) html += `<p class="aviso warn">Os dados do mercado não carregaram (${esc(state.err)}). Recarregue a página mais tarde.</p>`;
    html += state.view === 'aporte' ? renderAporte() : state.view === 'carteira' ? renderCarteira() : state.view === 'grafico' ? renderGrafico() : state.view === 'renda-fixa' ? renderRendaFixa() : renderNoticias();
    desmontarGrafico();
    v.innerHTML = html;
    if (state.view === 'grafico') montarGrafico();
  }

  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  function renderTabs() {
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.v === state.view)));
    const n = state.noticias && Array.isArray(state.noticias.itens) ? state.noticias.itens.length : 0;
    document.getElementById('ncount').textContent = n ? String(n) : '';
    const tit = document.getElementById('titulo');
    const nomes = { aporte: 'Aporte de ' + MESES[new Date().getMonth()], carteira: 'Carteira', grafico: 'Gráfico', 'renda-fixa': 'Renda fixa', noticias: 'Notícias' };
    tit.textContent = nomes[state.view] || 'Lydia';
  }

  function portaoHTML() {
    const a = state.acesso;
    const card = (titulo, corpo) => `<div class="card portao"><h2>${titulo}</h2>${corpo}</div>`;
    if (a === 'iniciando' || a === 'carregando') return card('Abrindo o painel…', '<p class="muted">Conferindo a sua conta.</p>');
    if (a === 'sem-sdk') return card('Não consegui carregar o Firebase', '<p class="muted">Confira a conexão e recarregue a página.</p>');
    if (a === 'sem-config') return card('Falta ligar o Firebase', '<p class="muted">Cole a configuração do app da Web no arquivo <code>firebase-config.js</code> e publique de novo. O passo a passo está no README do repositório.</p>');
    if (a === 'deslogado' || a === 'entrando') return card('Entrar', `<p class="muted">A carteira e o plano ficam guardados no Firebase, só para a sua conta Google.</p>
      <div class="row"><button class="btn primary" id="btn-entrar"${a === 'entrando' ? ' disabled' : ''}>${a === 'entrando' ? 'Entrando…' : 'Entrar com Google'}</button></div>
      ${state.msgLogin ? `<p class="erro">${esc(state.msgLogin)}</p>` : ''}`);
    if (a === 'negado') return card('Esta conta não tem acesso', `<p class="muted">${esc((state.user && state.user.email) || 'Esta conta')} não está liberada nas regras do Firestore deste painel.</p>
      <div class="row"><button class="btn" id="btn-sair2">Sair e entrar com outra conta</button></div>`);
    if (a === 'sem-plano' || a === 'plano-invalido') return card(a === 'sem-plano' ? 'Configurar o plano' : 'O plano salvo está com problema', `
      <p class="small muted">${a === 'sem-plano' ? 'Primeira vez neste banco: cole o texto do plano (o JSON das cinco fases) e salve. Ele fica só na sua conta, fora do código público.' : esc(state.planoProblema) + ' Cole o plano de novo para corrigir.'}</p>
      <label class="label" for="in-plano">Plano (JSON)</label>
      <textarea id="in-plano" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder='{"fases": [ … ]}'>${esc(state.planoTexto)}</textarea>
      ${state.planoErro ? `<p class="erro">${esc(state.planoErro)}</p>` : ''}
      <div class="row"><button class="btn primary" id="btn-salvar-plano"${state.salvandoPlano ? ' disabled' : ''}>${state.salvandoPlano ? 'Salvando…' : 'Salvar plano'}</button></div>`);
    return card('Algo deu errado', `<p class="muted">${esc(state.erroBanco || 'Recarregue a página.')}</p>`);
  }

  function renderConta() {
    const el = document.getElementById('conta');
    const u = state.user;
    el.hidden = !u;
    el.innerHTML = u ? `Conectado como ${esc(u.email || u.displayName || 'sua conta Google')} · <button class="link-btn" id="btn-sair">Sair</button>` : '';
  }

  function renderAll() {
    const ok = state.acesso === 'ok';
    document.getElementById('tabs').hidden = !ok;
    document.getElementById('titulo').hidden = !ok;
    renderConta();
    if (ok) { renderPills(); renderTabs(); } else document.getElementById('pills').innerHTML = '';
    renderView();
  }

  // ---------- gravação ----------
  let dirty = 0;
  function agendarSalvar() {
    dirty++;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      if (!db || state.readOnly) { dirty = 0; return; }
      const marca = dirty;
      const body = { qtd: { ...local.qtd }, fase: local.fase, aporte: isNum(local.aporte) ? local.aporte : null, atualizadoEm: new Date().toISOString() };
      state.saving = true;
      saveChain = saveChain.then(() => db.doc('painel/carteira').set(body)).then(() => {
        state.saving = false; if (dirty === marca) dirty = 0; renderView();
      }).catch(e => {
        state.saving = false; dirty = 0; if (e && e.code === 'permission-denied') { state.readOnly = true; } renderView();
      });
    }, 700);
  }
  function parseNum(s) { const t = String(s).replace(/\s|R\$/g, '').replace(/\./g, '').replace(',', '.'); const n = parseFloat(t); return isFinite(n) ? n : null; }

  // ---------- eventos ----------
  document.getElementById('tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return; state.view = b.dataset.v; try { history.replaceState(null, '', '#' + state.view + (state.view === 'grafico' ? '/' + state.gt : '')); } catch (_) { location.hash = state.view; } renderTabs(); state.pendingRender = false; document.activeElement && document.activeElement.blur && document.activeElement.blur(); renderView();
  });
  document.getElementById('view').addEventListener('click', e => {
    if (e.target.id === 'btn-entrar') { entrar(); return; }
    if (e.target.id === 'btn-sair2') { sair(); return; }
    if (e.target.id === 'btn-salvar-plano') { salvarPlano(); return; }
    if (e.target.id === 'btn-registrar') {
      const r = robo(aporteAtual());
      if (r.escolha && r.cotas > 0 && !state.readOnly) { const t = r.escolha.a.t; local.qtd[t] = (+local.qtd[t] || 0) + r.cotas; state.ultimaCompra = { t, q: r.cotas }; agendarSalvar(); renderView(); }
      return;
    }
    if (e.target.id === 'btn-desfazer-compra') {
      const u = state.ultimaCompra;
      if (u) { local.qtd[u.t] = Math.max(0, (+local.qtd[u.t] || 0) - u.q); state.ultimaCompra = null; agendarSalvar(); renderView(); }
      return;
    }
    if (e.target.id === 'btn-ver-escada') { const el = document.getElementById('escada'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (e.target.id === 'btn-editar') { state.editando = !state.editando; renderView(); return; }
    const cf = e.target.closest('[data-cf]'); if (cf) { state.cfiltro = cf.dataset.cf; renderView(); return; }
    const rf = e.target.closest('[data-rf]'); if (rf) { state.rf = rf.dataset.rf; renderView(); return; }
    const d = e.target.closest('.degrau');
    if (d) { const n = +d.dataset.fase; state.escolhida = n === fase().n ? null : n; renderView(); return; }
    if (e.target.id === 'btn-cancela-fase') { state.escolhida = null; renderView(); return; }
    if (e.target.id === 'btn-confirma-fase') { local.fase = state.escolhida; local.aporte = null; state.escolhida = null; agendarSalvar(); renderAll(); return; }
    const g = e.target.closest('[data-gt]');
    if (g) { state.gt = g.dataset.gt; try { history.replaceState(null, '', '#grafico/' + state.gt); } catch (_) {} renderView(); return; }
    const per = e.target.closest('[data-per]');
    if (per) { state.gtPeriodo = +per.dataset.per; document.querySelectorAll('[data-per]').forEach(b => b.setAttribute('aria-pressed', String(b === per))); aplicarPeriodo(); return; }
    if (e.target.id === 'btn-token-salvar') { const i = document.getElementById('in-token'); const v = (i && i.value || '').trim(); if (v) { tokenBrapi(v); brapiCache = {}; } if (i) i.blur(); renderView(); return; }
    if (e.target.id === 'btn-token-remover') { tokenBrapi(''); brapiCache = {}; renderView(); return; }
    const f = e.target.closest('.filtro'); if (f && f.dataset.f) { state.filtro = f.dataset.f; renderView(); }
  });
  document.getElementById('view').addEventListener('input', e => {
    const i = e.target;
    if (i.id === 'in-plano') { state.planoTexto = i.value; return; }
    if (i.matches('input.qtd')) { const n = parseNum(i.value); local.qtd[i.dataset.t] = n && n > 0 ? n : 0; agendarSalvar(); }
    if (i.id === 'in-aporte') { const n = parseNum(i.value); local.aporte = n && n > 0 ? n : null; agendarSalvar(); }
  });
  document.getElementById('view').addEventListener('focusout', e => {
    const prox = e.relatedTarget;
    if (prox && prox.closest && prox.closest('#view button')) return;
    setTimeout(renderView, 0);
  });
  function lerHash() {
    const [h, t] = decodeURIComponent((location.hash || '').replace('#', '')).split('/');
    if (['aporte', 'carteira', 'grafico', 'renda-fixa', 'noticias'].includes(h)) state.view = h;
    if (h === 'grafico' && t && ATIVOS.some(a => a.t === t.toUpperCase())) state.gt = t.toUpperCase();
  }
  window.addEventListener('hashchange', () => { lerHash(); renderTabs(); renderView(); if (state.view === 'grafico') window.scrollTo({ top: 0 }); });

  // ---------- dados do mercado: arquivos públicos gravados pela tarefa agendada ----------
  async function lerJSON(nome) {
    const r = await fetch(`data/${nome}.json`, { cache: 'no-cache' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    if (!j || typeof j !== 'object' || Array.isArray(j)) throw new Error('formato inválido');
    return j;
  }
  let slowTimer = null;
  async function carregarDados() {
    clearTimeout(slowTimer);
    slowTimer = setTimeout(() => { if (!state.confirmed) { state.slow = true; renderAll(); } }, 10000);
    const [m, n] = await Promise.allSettled([lerJSON('mercado'), lerJSON('noticias')]);
    clearTimeout(slowTimer);
    if (m.status === 'fulfilled') { state.mercado = m.value; state.confirmed = true; state.slow = false; }
    if (n.status === 'fulfilled') state.noticias = n.value;
    state.err = (m.status === 'rejected' && !state.mercado) ? 'não consegui ler data/mercado.json' : null;
    state.carregadoEm = Date.now();
    renderAll();
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - state.carregadoEm > 20 * 60 * 1000) carregarDados();
  });

  // ---------- plano: fases pessoais guardadas no Firestore ----------
  function validarPlano(p) {
    if (!p || typeof p !== 'object' || Array.isArray(p)) return 'O plano precisa ser um objeto JSON.';
    const f = p.fases;
    if (!Array.isArray(f) || f.length !== 5) return 'O plano precisa ter exatamente 5 fases (0 a 4).';
    for (let i = 0; i < 5; i++) {
      const x = f[i];
      if (!x || typeof x !== 'object' || x.n !== i) return `A fase na posição ${i} precisa ter "n": ${i}.`;
      for (const k of ['nome', 'destino', 'portao']) if (typeof x[k] !== 'string' || !x[k].trim()) return `Fase ${i}: falta o texto "${k}".`;
      for (const k of ['aporte', 'meninas']) if (!isNum(x[k]) || x[k] < 0) return `Fase ${i}: "${k}" precisa ser um número.`;
    }
    for (const k of ['travaRegra', 'meninasNota']) if (p[k] != null && typeof p[k] !== 'string') return `"${k}" precisa ser texto.`;
    return null;
  }
  async function salvarPlano() {
    if (!db || state.salvandoPlano) return;
    let p;
    try { p = JSON.parse(state.planoTexto); }
    catch (_) { state.planoErro = 'Esse texto não é um JSON válido. Copie o plano inteiro, da primeira { até a última }.'; renderAll(); return; }
    const prob = validarPlano(p);
    if (prob) { state.planoErro = prob; renderAll(); return; }
    const body = {
      fases: p.fases.map(x => ({ n: x.n, nome: x.nome.trim(), destino: x.destino.trim(), portao: x.portao.trim(), aporte: x.aporte, meninas: x.meninas })),
      travaRegra: p.travaRegra || null, meninasNota: p.meninasNota || null, atualizadoEm: new Date().toISOString()
    };
    state.salvandoPlano = true; state.planoErro = ''; renderAll();
    try { await db.doc('painel/plano').set(body); state.planoTexto = ''; }
    catch (e) { state.planoErro = (e && e.code === 'permission-denied') ? 'O Firestore recusou a gravação. Confira o e-mail nas regras do banco.' : 'Não consegui salvar. Tente de novo.'; }
    state.salvandoPlano = false; renderAll();
  }

  // ---------- conta Google e banco (Firebase) ----------
  let auth = null, desligar = [], got = {};
  const MSG_LOGIN = {
    'auth/unauthorized-domain': 'Este endereço ainda não está autorizado no Firebase (Authentication › Configurações › Domínios autorizados).',
    'auth/operation-not-allowed': 'O login com Google não está ativado no Firebase (Authentication › Método de login).',
    'auth/network-request-failed': 'Sem conexão com o Google. Confira a internet e tente de novo.',
    'auth/too-many-requests': 'Muitas tentativas seguidas. Espere um pouco e tente de novo.'
  };
  async function entrar() {
    if (!auth || state.acesso === 'entrando') return;
    state.acesso = 'entrando'; state.msgLogin = ''; renderAll();
    const prov = new firebase.auth.GoogleAuthProvider();
    prov.setCustomParameters({ prompt: 'select_account' });
    try { await auth.signInWithPopup(prov); }
    catch (e) {
      let erro = e;
      const c = e && e.code;
      if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') {
        try { await auth.signInWithRedirect(prov); return; } catch (e2) { erro = e2; }
      }
      if (!state.user) state.acesso = 'deslogado';
      const ec = erro && erro.code;
      state.msgLogin = (ec === 'auth/popup-closed-by-user' || ec === 'auth/cancelled-popup-request') ? '' : (MSG_LOGIN[ec] || 'Não consegui entrar. Tente de novo.');
      renderAll();
    }
  }
  function sair() { if (auth) auth.signOut().catch(() => {}); }
  function desligarBanco() { desligar.forEach(f => { try { f(); } catch (_) {} }); desligar = []; got = {}; }
  function decidir() {
    if (state.acesso === 'negado' || state.acesso === 'erro') return renderAll();
    if (!got.plano || !got.carteira) return renderAll();
    const pd = state.planoDoc;
    if (!pd.exists) { state.acesso = 'sem-plano'; FASES = []; PLANO = {}; }
    else {
      const prob = validarPlano(pd.data);
      if (prob) { state.acesso = 'plano-invalido'; state.planoProblema = prob; FASES = []; PLANO = {}; }
      else { PLANO = pd.data; FASES = pd.data.fases; state.planoErro = ''; state.planoProblema = ''; state.acesso = 'ok'; }
    }
    renderAll();
  }
  function ligarBanco() {
    desligarBanco();
    const falhou = e => {
      if (e && e.code === 'permission-denied') state.acesso = 'negado';
      else { state.acesso = 'erro'; state.erroBanco = 'O banco não respondeu (' + ((e && e.code) || 'erro') + '). Recarregue a página.'; }
      desligarBanco(); renderAll();
    };
    desligar.push(db.doc('painel/plano').onSnapshot(s => {
      state.planoDoc = { exists: s.exists, data: s.exists ? s.data() : null };
      got.plano = true; decidir();
    }, falhou));
    desligar.push(db.doc('painel/carteira').onSnapshot(s => {
      state.carteira = s.exists ? s.data() : null;
      if (!s.metadata.hasPendingWrites && !dirty && state.carteira) {
        const c = state.carteira; local = { qtd: { ...(c.qtd || {}) }, fase: isNum(c.fase) ? c.fase : 0, aporte: isNum(c.aporte) ? c.aporte : null };
      }
      got.carteira = true; decidir();
    }, falhou));
  }
  document.getElementById('conta').addEventListener('click', e => { if (e.target.id === 'btn-sair') sair(); });

  // ---------- tema: automático (segue o aparelho), escuro ou claro ----------
  const TEMA_KEY = 'lydia.tema';
  const TEMA_ICONE = {
    auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
    escuro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
    claro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
  };
  const TEMA_NOME = { auto: 'Automático', escuro: 'Escuro', claro: 'Claro' };
  function lerTema() { try { const t = localStorage.getItem(TEMA_KEY); return TEMA_NOME[t] ? t : 'auto'; } catch (_) { return 'auto'; } }
  function aplicarTema(t) {
    const r = document.documentElement;
    if (t === 'claro') r.setAttribute('data-theme', 'light'); else if (t === 'escuro') r.setAttribute('data-theme', 'dark'); else r.removeAttribute('data-theme');
    const b = document.getElementById('btn-tema');
    b.innerHTML = TEMA_ICONE[t] + TEMA_NOME[t];
    b.setAttribute('aria-label', `Tema: ${TEMA_NOME[t]}. Toque para trocar.`);
  }
  document.getElementById('btn-tema').addEventListener('click', () => {
    const ordem = ['auto', 'escuro', 'claro'];
    const t = ordem[(ordem.indexOf(lerTema()) + 1) % ordem.length];
    try { if (t === 'auto') localStorage.removeItem(TEMA_KEY); else localStorage.setItem(TEMA_KEY, t); } catch (_) {}
    aplicarTema(t);
    if (state.view === 'grafico' && state.acesso === 'ok') renderView();
  });
  aplicarTema(lerTema());

  function boot() {
    lerHash(); renderAll();
    carregarDados();
    const cfg = window.LYDIA_FIREBASE;
    if (!window.firebase || typeof firebase.initializeApp !== 'function') { state.acesso = 'sem-sdk'; renderAll(); return; }
    if (!cfg || typeof cfg.apiKey !== 'string' || !cfg.projectId || /COLE/i.test(cfg.apiKey)) { state.acesso = 'sem-config'; renderAll(); return; }
    try { firebase.initializeApp(cfg); auth = firebase.auth(); db = firebase.firestore(); }
    catch (_) { state.acesso = 'sem-sdk'; renderAll(); return; }
    auth.getRedirectResult().catch(e => { state.msgLogin = MSG_LOGIN[e && e.code] || ''; renderAll(); });
    auth.onAuthStateChanged(u => {
      state.user = u || null;
      if (!u) {
        desligarBanco(); FASES = []; PLANO = {}; local = { qtd: {}, fase: 0, aporte: null };
        state.carteira = null; state.planoDoc = null; state.escolhida = null; state.readOnly = false;
        if (state.acesso !== 'entrando') state.acesso = 'deslogado';
        renderAll(); return;
      }
      state.acesso = 'carregando'; state.msgLogin = ''; renderAll();
      ligarBanco();
    });
  }
  boot();
})();
</script>

</body></html>
